[project]
name = "barcelona-go-go"
version = "0.1.0"
description = "Possession labelling and tracking viewer for More Than a Hack 2027"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.8",
    "pandas>=3.0.6",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
eda = ["jupyterlab>=4.6.4", "matplotlib>=3.11.2"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]
# The official scorer is copied unchanged from the organisers' repository.
extend-exclude = "src/utilities/possession_metrics.py"

[dependency-groups]
dev = [
    "black>=26.10.1",
]
