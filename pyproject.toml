[project]
name = "barcelona-go-go"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.4",
    "kloppy==3.18.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "opencv-python>=4.8",
    "pandas>=3.0.6",
    "pydantic>=2.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.183",
]

[project.optional-dependencies]
eda = [
    "numpy>=2.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.0",
    "pydantic>=2.0",
]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=26.10.1",
]
